name: cha0s

options:
  bundleIdPrefix: com.cha0s
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  cha0s:
    type: application
    platform: iOS

    sources:
      - path: LARA
        excludes:
          - "**/*.md"
          - "**/README*"
          - "**/LICENSE*"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cha0s.toolkit
        PRODUCT_NAME: cha0s
        INFOPLIST_KEY_CFBundleDisplayName: cha0s
        INFOPLIST_KEY_CFBundleShortVersionString: "0.6.0"
        INFOPLIST_KEY_CFBundleVersion: "6"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/LARA"
          - "$(SRCROOT)/LARA/bad_query"
        CLANG_ENABLE_MODULES: YES
