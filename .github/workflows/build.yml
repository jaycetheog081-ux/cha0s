name: Build cha0s

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout cha0s
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -eu

          test -f project.yml
          test -f LARA/BadQueryModule.h
          test -f LARA/BadQueryModule.m
          test -f LARA/bad_query/bad_query.h
          test -f LARA/bad_query/bad_query.c

          echo "Required project and bad_query files found."

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        run: |
          set -o pipefail

          xcodebuild \
            -project cha0s.xcodeproj \
            -scheme cha0s \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package IPA
        run: |
          set -eu

          APP_PATH="build/Build/Products/Release-iphoneos/cha0s.app"
          test -d "$APP_PATH"

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r ../cha0s-v0.6.0-build6.ipa Payload

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-v0.6.0-build6
          path: |
            cha0s-v0.6.0-build6.ipa
            build.log
          if-no-files-found: warn
