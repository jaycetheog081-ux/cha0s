name: Build cha0s

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose repository files
        run: |
          echo "===== Repository root ====="
          pwd
          ls -la

          echo "===== Project files ====="
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            ! -path "./build/*" \
            | sort

      - name: Validate project configuration
        run: |
          set -eu

          if [ ! -f project.yml ]; then
            echo "::error::project.yml is missing from the repository root."
            exit 1
          fi

          if [ ! -d LARA ]; then
            echo "::error::LARA directory is missing."
            exit 1
          fi

          echo "Project configuration and LARA directory found."

      - name: Check bad_query dependencies
        id: badquery
        continue-on-error: true
        run: |
          echo "===== Searching for bad_query files ====="

          HEADER="$(find LARA -type f -name bad_query.h -print -quit)"
          SOURCE="$(find LARA -type f -name bad_query.c -print -quit)"

          if [ -z "$HEADER" ]; then
            echo "::error::bad_query.h was not found under LARA."
            exit 1
          fi

          if [ -z "$SOURCE" ]; then
            echo "::error::bad_query.c was not found under LARA."
            exit 1
          fi

          echo "Header: $HEADER"
          echo "Source: $SOURCE"
          echo "bad_query dependencies found."

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build cha0s
        id: build
        run: |
          set -o pipefail

          xcodebuild \
            -project cha0s.xcodeproj \
            -scheme cha0s \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        if: success()
        run: |
          set -eu

          APP_PATH="build/Build/Products/Release-iphoneos/cha0s.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built application bundle not found: $APP_PATH"
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/cha0s.app

          cd ipa
          zip -qr ../cha0s-v0.6.0-build6.ipa Payload

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-build-diagnostics
          path: |
            build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-v0.6.0-build6
          path: cha0s-v0.6.0-build6.ipa
          if-no-files-found: error
