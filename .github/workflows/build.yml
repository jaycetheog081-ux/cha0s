name: Build cha0s

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -eu
          brew install xcodegen
          xcodegen generate

      - name: Build cha0s
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project cha0s.xcodeproj \
            -scheme cha0s \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Show concise errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== DashboardViewController.m errors ==="
          grep -E 'DashboardViewController\.m:[0-9]+:[0-9]+: (error|fatal error):' build.log | head -15 || true

          echo "=== Other compiler errors ==="
          grep -E '/LARA/[^ ]+:[0-9]+:[0-9]+: (error|fatal error):' build.log \
            | grep -v 'DashboardViewController.m:' \
            | head -10 || true

          echo "=== Build failure summary ==="
          grep -E '\*\* BUILD FAILED \*\*|error:|fatal error:' build.log \
            | tail -10 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-build-log
          path: build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package IPA
        run: |
          set -eu
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/cha0s.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload artifacts
          cp -R "$APP_PATH" build/Payload/cha0s.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/Payload artifacts/cha0s.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-unsigned-ipa
          path: artifacts/cha0s.ipa
          if-no-files-found: error
          retention-days: 14
