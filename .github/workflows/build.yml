name: Build cha0s

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -eu
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          set -eu
          brew install xcodegen
          xcodegen --version

      - name: Check project files
        run: |
          set -eu

          echo "Repository root:"
          pwd

          echo "Root directory contents:"
          ls -la

          if [ ! -f project.yml ]; then
            echo "::error::project.yml is missing from the repository root."
            exit 1
          fi

          if [ ! -d LARA ]; then
            echo "::error::LARA source directory is missing."
            exit 1
          fi

          echo "Project configuration:"
          cat project.yml

          echo "Source files:"
          find LARA -type f -print

          if [ -z "$(find LARA -type f \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.swift' \) -print -quit)" ]; then
            echo "::error::No supported source files were found in LARA."
            exit 1
          fi

          if [ ! -f LARA/bad_query/bad_query.c ] || [ ! -f LARA/bad_query/bad_query.h ]; then
            echo "::notice::The bad_query files are not at the expected paths; checking the repository for their actual locations."
            find . -type f \( -name 'bad_query.c' -o -name 'bad_query.h' \) -print
          fi

      - name: Generate Xcode project
        run: |
          set -eu
          xcodegen generate
          test -d cha0s.xcodeproj
          xcodebuild -list -project cha0s.xcodeproj

      - name: Build cha0s
        run: |
          set -eu

          xcodebuild \
            -project cha0s.xcodeproj \
            -scheme cha0s \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -eu

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/cha0s.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::The compiled cha0s.app was not found."
            find build/DerivedData/Build/Products -maxdepth 4 -print
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/cha0s.app

          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/Payload \
            artifacts/cha0s.ipa

          test -s artifacts/cha0s.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-unsigned-ipa
          path: artifacts/cha0s.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cha0s-build-diagnostics
          path: |
            project.yml
            build/DerivedData/Logs/Build/
          if-no-files-found: ignore
          retention-days: 7
